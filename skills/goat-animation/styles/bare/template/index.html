<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script src="plan.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/Inter%5Bopsz,wght%5D.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; }
      .line { position: absolute; left: 120px; width: 840px; text-align: center; transform: translateY(-50%); }
      #obj { top: 760px; font-size: 64px; font-weight: 700; }
      #cap { top: 1180px; font-size: 40px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="obj" class="line"></div>
      <div id="cap" class="line"></div>
    </div>
    <script>
      const P = window.PLAN;
      document.body.style.background = P.brand.paper;
      document.body.style.color = P.brand.ink;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      // ask for the font now: a render worker that starts mid-video must not draw its first captions in a fallback font
      window.__hf.buildReady.fonts = document.fonts.load('500 36px "Inter"').then(() => document.fonts.ready);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      const obj = document.getElementById("obj"), cap = document.getElementById("cap");
      // every frame comes from t: the beat on now (the first one from frame 0) and the caption group on now
      function renderAt(t) {
        const beat = P.beats.filter((b, i) => !i || b.t <= t).at(-1);
        obj.textContent = beat ? beat.object : "";
        const g = P.captions.find((c) => c.start <= t && t < c.end);
        cap.textContent = g ? g.text : "";
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    </script>
  </body>
</html>
