<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./shared/three/three.module.js" } }</script>
    <script src="plan.js"></script>
    <style>
      @font-face { font-family: "Oswald"; src: url("fonts/Oswald%5Bwght%5D.ttf"); }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono%5Bwght%5D.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #d8d5cf; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      #grain { position: absolute; inset: 0; }
      .layer { position: absolute; inset: 0; }
      .shape { position: absolute; background: var(--accent); transform-origin: center; }
      .cut { position: absolute; transform-origin: center; filter: drop-shadow(7px 12px 0 rgba(20, 18, 14, 0.16)); }
      .word { position: absolute; font-family: "Oswald", sans-serif; font-weight: 700; color: var(--ink); line-height: 0.86;
        letter-spacing: -0.01em; white-space: nowrap; text-transform: uppercase; transform-origin: left center; }
      .word.stamp { color: #fff; background: var(--accent); padding: 0.08em 0.16em 0.02em; line-height: 0.95; transform-origin: center; }
      .label { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 600; letter-spacing: 0.08em;
        color: var(--ink); opacity: 0.75; text-transform: uppercase; white-space: nowrap; }
      .crop { position: absolute; width: 44px; height: 44px; border-color: var(--ink); border-style: solid; border-width: 0; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <canvas id="grain" width="1080" height="1920"></canvas>
      <div id="page" class="layer"></div>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      // ask for the fonts now: a render worker that starts mid-video must not draw its first words in a fallback font
      window.__hf.buildReady.fonts = Promise.all([document.fonts.load('700 100px "Oswald"'), document.fonts.load('600 22px "JetBrains Mono"')]).then(() => document.fonts.ready);
      window.__hf.buildReady["collage"] = new Promise((r) => (window.__collageReady = r));
      window.__lastT = 0;
      window.addEventListener("hf-seek", (e) => {
        window.__lastT = e.detail.time;
        if (window.__renderAt) window.__renderAt(e.detail.time);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="collage.js"></script>
  </body>
</html>
