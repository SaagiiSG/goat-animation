<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./shared/three/three.module.js" } }</script>
    <script src="plan.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/Inter%5Bopsz,wght%5D.ttf"); }
      @font-face { font-family: "PT Serif"; font-style: italic; src: url("fonts/PT_Serif-Web-Italic.ttf"); }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono%5Bwght%5D.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f3f1ec; font-family: "Inter", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #cap { position: absolute; left: 120px; top: 300px; width: 760px; font-size: 50px; font-weight: 500; line-height: 1.18;
        letter-spacing: -0.01em; color: var(--ink); }
      #cap span { display: inline-block; margin-right: 0.24em; }
      #cap span.hot { font-family: "PT Serif", serif; font-style: italic; font-weight: 400; font-size: 1.1em; letter-spacing: 0;
        color: var(--accent-text); }
      #cta { position: absolute; transform: translateY(-50%); font-size: 46px; font-weight: 600; color: #2b2b30; white-space: nowrap; }
      #term { position: absolute; font-family: "JetBrains Mono", "Inter", monospace; font-size: 26px; line-height: 1.45; color: #2b2b30; white-space: pre; }
      #term .hot { color: var(--accent); }
      #tag { position: absolute; display: none; transform-origin: left bottom; font-family: "JetBrains Mono", "Inter", monospace;
        font-size: 28px; font-weight: 700; letter-spacing: 0.03em; color: #fff; background: var(--accent); padding: 6px 18px;
        border-radius: 6px; white-space: nowrap; box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.18); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920"></canvas>
      <div id="cap"></div>
      <div id="cta"></div>
      <div id="term"></div>
      <div id="tag"></div>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      // ask for the fonts now: a render worker that starts mid-video must not draw its first captions in a fallback font
      window.__hf.buildReady.fonts = Promise.all([document.fonts.load('500 50px "Inter"'), document.fonts.load('italic 400 55px "PT Serif"'), document.fonts.load('600 26px "JetBrains Mono"')]).then(() => document.fonts.ready);
      window.__hf.buildReady["three-scene"] = new Promise((r) => (window.__threeReady = r));
      window.__lastT = 0;
      window.addEventListener("hf-seek", (e) => {
        window.__lastT = e.detail.time;
        if (window.__renderAt) window.__renderAt(e.detail.time);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="stage.js"></script>
  </body>
</html>
