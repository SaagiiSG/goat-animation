<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./shared/three/three.module.js" } }</script>
    <script src="plan.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/Inter%5Bopsz,wght%5D.ttf"); }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono%5Bwght%5D.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Inter", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #cap { position: absolute; left: 120px; width: 840px; top: 1180px; transform: translateY(-50%); text-align: center;
        color: #fff; font-size: 36px; font-weight: 500; letter-spacing: 0.01em; white-space: nowrap; }
      #cap span { display: inline-block; margin: 0 0.13em; }
      #cta { position: absolute; transform: translateY(-50%); font-size: 56px; font-weight: 600; white-space: nowrap; }
      #term { position: absolute; font-family: "JetBrains Mono", "Inter", monospace; font-size: 30px; line-height: 1.45;
        color: #fff; white-space: pre; text-shadow: 0 0 10px rgba(255, 255, 255, 0.35); }
      #term .hot { color: var(--accent-text); text-shadow: 0 0 12px var(--accent); }
      #tag { position: absolute; display: none; transform-origin: left bottom; font-family: "JetBrains Mono", "Inter", monospace;
        font-size: 28px; font-weight: 600; letter-spacing: 0.04em; color: var(--accent-text); padding: 6px 18px;
        border: 2px solid var(--accent); border-radius: 999px; background: rgba(0, 0, 0, 0.55); white-space: nowrap;
        box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); text-shadow: 0 0 10px var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920"></canvas>
      <div id="cap"></div>
      <div id="cta"></div>
      <div id="term"></div>
      <div id="tag"></div>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      // ask for the font now: a render worker that starts mid-video must not draw its first captions in a fallback font
      window.__hf.buildReady.fonts = Promise.all([document.fonts.load('500 36px "Inter"'), document.fonts.load('600 30px "JetBrains Mono"')]).then(() => document.fonts.ready);
      window.__hf.buildReady["three-scene"] = new Promise((r) => (window.__threeReady = r));
      window.__lastT = 0;
      window.addEventListener("hf-seek", (e) => {
        window.__lastT = e.detail.time;
        if (window.__renderAt) window.__renderAt(e.detail.time);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="wireframe.js"></script>
  </body>
</html>
