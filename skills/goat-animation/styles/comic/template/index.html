<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./shared/three/three.module.js" } }</script>
    <script src="plan.js"></script>
    <style>
      @font-face { font-family: "Shantell Sans"; src: url("fonts/ShantellSans%5BBNCE,INFM,SPAC,wght%5D.ttf"); }
      @font-face { font-family: "Science Gothic"; src: url("fonts/ScienceGothic%5BCTRS,slnt,wdth,wght%5D.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4efe4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #page, #gutters, #over { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .box, .bubble, .card { position: absolute; font-family: "Shantell Sans", sans-serif; font-weight: 800; text-transform: uppercase;
        color: #141414; line-height: 1.08; letter-spacing: 0.01em; font-variation-settings: "INFM" 1; }
      .box { background: #ffe45c; border: 5px solid #141414; padding: 14px 22px 16px; font-size: 38px; box-shadow: 7px 7px 0 #141414; }
      .bubble { background: #fff; border: 5px solid #141414; border-radius: 46px; padding: 22px 32px 24px; font-size: 42px; text-align: center; }
      .bubble.small { font-size: 34px; padding: 16px 22px 18px; border-radius: 34px; }
      .bubble svg { position: absolute; overflow: visible; }
      .box .hot, .bubble .hot { color: var(--accent); }
      .card { background: #141414; color: #fff; font-size: 30px; padding: 6px 14px; letter-spacing: 0.06em; }
      .sfx { position: absolute; font-family: "Science Gothic", sans-serif; font-variation-settings: "wdth" 125, "wght" 900; font-size: 200px;
        line-height: 1; color: var(--accent); -webkit-text-stroke: 11px #141414; paint-order: stroke fill; white-space: nowrap;
        text-shadow: 14px 14px 0 #ffe45c, 14px 14px 0 #141414; transform-origin: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <canvas id="page" width="1080" height="1920"></canvas>
      <svg id="gutters" viewBox="0 0 1080 1920"></svg>
      <div id="over"></div>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      // ask for the fonts now: a render worker that starts mid-video must not draw its first words in a fallback font
      window.__hf.buildReady.fonts = Promise.all([document.fonts.load('800 42px "Shantell Sans"'), document.fonts.load('900 200px "Science Gothic"')]).then(() => document.fonts.ready);
      window.__hf.buildReady["three-scene"] = new Promise((r) => (window.__threeReady = r));
      window.__lastT = 0;
      window.addEventListener("hf-seek", (e) => {
        window.__lastT = e.detail.time;
        if (window.__renderAt) window.__renderAt(e.detail.time);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="comic.js"></script>
  </body>
</html>
